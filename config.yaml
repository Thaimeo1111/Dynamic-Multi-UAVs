# T23 - cau hinh tham so (doc boi run_batch.py / run_small.py). Chinh o day, khong sua code.
params:                  # ghi de model.DEFAULT_P
  battery: 300.0         # nang luong moi UAV (quy ra quang duong khi eps = 1)
  w_d: 1.0
  w_r: 5.0               # trong so phoi nhiem rui ro
  w_l: 1.0               # trong so tre (moi don vi thoi gian)
  w_u: 300.0             # phat moi khach khong phuc vu
  theta_ban: 0.8         # nguong cam bay
  depot_safe: 8.0
scenario:
  intensity: med         # low | med | high
  online_frac: 0.3       # ty le khach xuat hien dan
alns:
  iters: {25: 150, 50: 250, 100: 400, 200: 600}   # so vong ALNS MOI LAN GIAI (theo co instance); tu tuning (docs/tuning_alns.md)
  static_mult: 3.0       # ALNS tinh/khong-rolling duoc nhan ngan sach nay (chi giai mot lan)
  min_gap: 40.0          # khoang cach toi thieu giua hai lan tai lap ke hoach do khach moi den
  dt_replan: 100.0       # chu ky tai lap ke hoach cua ALNS dong
  q_hi: 0.3              # ty le toi da khach bi go moi vong
  time_limit_s: {25: 2, 50: 5, 100: 15}  # CHI de canh bao/an toan; thi nghiem dung so vong de tai lap duoc
instances:               # DU LIEU THAT: Solomon goc (25/50 = n khach dau tien, 100 day du), nhom C / R / RC (T18)
  main:
    - data/solomon_small/C101_025.txt
    - data/solomon_small/C109_025.txt
    - data/solomon_small/R101_025.txt
    - data/solomon_small/RC101_025.txt
    - data/solomon_small/C101_050.txt
    - data/solomon_small/C106_050.txt
    - data/solomon_small/R101_050.txt
    - data/solomon_small/RC101_050.txt
    - data/solomon_100/C101_100.txt
    - data/solomon_100/C109_100.txt
    - data/solomon_100/R101_100.txt
    - data/solomon_100/RC101_100.txt
  ablation_sensitivity:  # tap con (chi co 25 va 50 khach) de vua ngan sach tinh toan
    - data/solomon_small/C101_025.txt
    - data/solomon_small/R101_025.txt
    - data/solomon_small/C101_050.txt
    - data/solomon_small/RC101_050.txt
  large:                 # Gehring-Homberger 200 khach, chi nhom 1 (Q=200, horizon ngan)
    - data/homberger_200/C1_2_1_200.txt
    - data/homberger_200/R1_2_1_200.txt
    - data/homberger_200/RC1_2_1_200.txt
experiments:
  main:      {algos: [greedy, alns_static, resolve, alns_dynamic], seeds: 20}
  ablation:  {algos: [dyn_no_riskprio, dyn_no_riskrem, dyn_no_warm, dyn_no_rolling, resolve_periodic], seeds: 20}
  large:     {algos: [greedy, alns_static, resolve, alns_dynamic], seeds: 5, battery: 450}
  sensitivity_large: {seeds: 5, battery: 450, theta_ban: [0.6, 0.7, 0.8, 0.9], w_r: [0.0, 2.5, 5.0, 10.0, 20.0]}
  sensitivity:
    seeds: 6
    dt: [50, 100, 200, 400]
    intensity: [low, med, high]
    w_r: [0.0, 2.5, 5.0, 10.0, 20.0]
    theta_ban: [0.6, 0.7, 0.8, 0.9]
    iters_scale: [0.25, 0.5, 1.0, 2.0]
    q_hi: [0.1, 0.2, 0.3, 0.4]
